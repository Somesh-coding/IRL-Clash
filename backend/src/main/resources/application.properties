spring.application.name=irl-clash
server.port=${PORT:8080}
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-3.8-flash}
game.match-radius-meters=${MATCH_RADIUS_METERS:50}
game.presence-timeout-seconds=${PRESENCE_TIMEOUT_SECONDS:20}
game.max-image-bytes=${MAX_IMAGE_BYTES:5000000}
app.allowed-origin=${ALLOWED_ORIGIN:http://localhost:5173}
